    const stage = document.getElementById('stage');

    const diagnosticsEnabled = new URLSearchParams(window.location.search).has('diagnostics');
    if (diagnosticsEnabled) {
      const retainedLines = [];
      const maximumRetainedLines = 200;
      const maximumLineLength = 2048;
      const appendDiagnostic = (level, args) => {
        const seconds = (performance.now() / 1000).toFixed(3);
        let line = Array.from(args, (value) => {
          try {
            return typeof value === 'string' ? value : JSON.stringify(value);
          } catch (_error) {
            return String(value);
          }
        }).join(' ');
        if (line.length > maximumLineLength) {
          line = line.slice(0, maximumLineLength) + '…';
        }
        retainedLines.push('[' + seconds + 's][' + level + '] ' + line);
        if (retainedLines.length > maximumRetainedLines) {
          retainedLines.splice(0, retainedLines.length - maximumRetainedLines);
        }
        diagnostics.textContent = retainedLines.join('\n');
        diagnostics.scrollTop = diagnostics.scrollHeight;
      };
      const originalLog = console.log.bind(console);
      const originalError = console.error.bind(console);
      console.log = (...args) => {
        originalLog(...args);
        appendDiagnostic('log', args);
      };
      console.error = (...args) => {
        originalError(...args);
        appendDiagnostic('error', args);

    function renderProgress() {

    function scheduleBlock(block) {
      try {
        const now = context.currentTime;
        if (nextStartTime < now) {
          largestGapMilliseconds = Math.max(largestGapMilliseconds,
            (now - nextStartTime) * 1000);
          applyUnderrunCount(underruns + 1);
          nextStartTime = now + BLOCK_FRAMES / SOURCE_RATE;
          segmentStartTime = nextStartTime;
        }
        const buffer = context.createBuffer(CHANNELS, BLOCK_FRAMES, SOURCE_RATE);
        for (let channel = 0; channel < CHANNELS; ++channel) {
          const output = buffer.getChannelData(channel);
          for (let frame = 0; frame < BLOCK_FRAMES; ++frame) {
            output[frame] = block[frame * CHANNELS + channel] / 32768;
          }
        }
        const source = context.createBufferSource();
        source.buffer = buffer;
        source.connect(context.destination);
        source.onended = () => { sources.delete(source); source.disconnect(); };
        sources.add(source);
        source.start(nextStartTime);
        nextStartTime += buffer.duration;
        sentFrames += BLOCK_FRAMES;
        ++scheduledBuffers;
        scheduledFrames += BLOCK_FRAMES;
        return true;
      } catch (reason) {
        return fail('schedule block', reason);
      }
    }

    function postBlock(block) {
      if (scheduledFallback) {
        return scheduleBlock(block);
      }
      if (workletNode === null || failed || !(block instanceof Int16Array)
          || block.length !== BLOCK_FRAMES * CHANNELS) {
        return false;
      }
      try {
        workletNode.port.postMessage(
          { type: 'enqueue', samples: block }, [block.buffer]);
        sentFrames += BLOCK_FRAMES;
        ++scheduledBuffers;
        scheduledFrames += BLOCK_FRAMES;
        return true;
      } catch (reason) {
        return fail('enqueue worklet block', reason);
      }
    }

    function flushPrepared() {
      if (!scheduledFallback && (!workletReady || workletNode === null)) {
        return true;
      }
      const pending = prepared;
      prepared = [];
      preparedFrames = 0;
      for (const block of pending) {
        if (!postBlock(block)) {
          return false;
        }
      }
      return true;
    }

    async function prepareWorklet(createdContext) {
      let moduleUrl = null;
      try {
        if (createdContext.audioWorklet === undefined
            || typeof createdContext.audioWorklet.addModule !== 'function'
            || typeof host.AudioWorkletNode !== 'function'
            || typeof host.Blob !== 'function'
            || host.URL === undefined
            || typeof host.URL.createObjectURL !== 'function') {
          fail('initialize', 'AudioWorklet is unavailable');
          return;
        }
        const moduleBlob = new host.Blob(
          [AUDIO_WORKLET_SOURCE], { type: 'text/javascript' });
        moduleUrl = host.URL.createObjectURL(moduleBlob);
        await createdContext.audioWorklet.addModule(moduleUrl);
        if (closing || failed || context !== createdContext) {
          return;
        }
        const node = new host.AudioWorkletNode(createdContext, PROCESSOR_NAME, {
          numberOfInputs: 0,
          numberOfOutputs: 1,
          outputChannelCount: [CHANNELS],
          channelCount: CHANNELS,
          channelCountMode: 'explicit',
          channelInterpretation: 'speakers',
        });
        node.port.onmessage = (event) => handleWorkletStatus(event.data);
        node.onprocessorerror = () => fail(
          'audio worklet processor', 'processor error');
        node.connect(createdContext.destination);
        workletNode = node;
        workletReady = true;
        if (started) {
          if (!flushPrepared()) {
            return;
          }
          node.port.postMessage({ type: 'start' });
        }
        detail(`worklet_ready=1 device_rate=${createdContext.sampleRate}`);
      } catch (reason) {
        fail('initialize audio worklet', reason);
      } finally {
        if (moduleUrl !== null && host.URL !== undefined
            && typeof host.URL.revokeObjectURL === 'function') {
          host.URL.revokeObjectURL(moduleUrl);
        }
      }
    }

    function initialize() {
      if (context !== null) {
        return !failed;
      }
      const Context = host.AudioContext || host.webkitAudioContext;
      if (typeof Context !== 'function') {
        return fail('initialize', 'Web Audio AudioContext is unavailable');
      }
      try {
        const createdContext = new Context({ latencyHint: 'interactive' });
        context = createdContext;
        createdContext.onstatechange = () => {
          ++contextStateChanges;
          if (createdContext.state === 'closed' && !closing) {
            fail('context state', 'closed unexpectedly');
            return;
          }
          detail(`context_state=${createdContext.state}`, false);
          if (context === createdContext) {
            recoverContextIfNeeded('state-change resume');
          }
        };
        scheduledFallback = host.isSecureContext === false
          || createdContext.audioWorklet === undefined
          || typeof host.AudioWorkletNode !== 'function';
        if (scheduledFallback) {
          if (typeof createdContext.createBuffer !== 'function'
              || typeof createdContext.createBufferSource !== 'function') {
            return fail('initialize', 'scheduled Web Audio is unavailable');
          }
        } else {
          observePromise('worklet setup', prepareWorklet(createdContext));
        }
        detail(`backend=${BACKEND_IDENTITY} source_rate=${SOURCE_RATE}`
          + ` delivery=${scheduledFallback ? 'scheduled' : 'worklet'}`
          + ` device_rate=${createdContext.sampleRate}`
          + ` block_frames=${BLOCK_FRAMES}`
          + ` target_frames=${targetFrames}`
          + ` low_water_frames=${lowWaterFrames()}`);
        return true;
      } catch (reason) {
        return fail('initialize', reason);
      }
    }

    function prepareFullBlock() {
      if (context === null || stagingFrames !== BLOCK_FRAMES) {
        return fail('prepare block', 'invalid staging state');
      }
      const block = staging;
      staging = new Int16Array(BLOCK_FRAMES * CHANNELS);
      stagingFrames = 0;
      if (started && (scheduledFallback || workletReady)) {
        return postBlock(block);
      }
      prepared.push(block);
      preparedFrames += BLOCK_FRAMES;
      return true;
    }

    function enqueue(samples) {
      if (context === null || failed || !(samples instanceof Int16Array)
          || samples.length === 0 || samples.length % CHANNELS !== 0) {
        return false;
      }
      recoverContextIfNeeded('enqueue resume');
      let sourceFrame = 0;
      const sourceFrames = samples.length / CHANNELS;
      while (sourceFrame < sourceFrames) {
        const copiedFrames = Math.min(
          BLOCK_FRAMES - stagingFrames, sourceFrames - sourceFrame);
        const sourceBegin = sourceFrame * CHANNELS;
        const sourceEnd = (sourceFrame + copiedFrames) * CHANNELS;
        staging.set(samples.subarray(sourceBegin, sourceEnd),
          stagingFrames * CHANNELS);
        stagingFrames += copiedFrames;
        sourceFrame += copiedFrames;
        if (stagingFrames === BLOCK_FRAMES && !prepareFullBlock()) {
          return false;
        }
      }
      return true;
    }

    function queuedFrames() {
      if (context === null || failed) {
        return -1;
      }
      recoverContextIfNeeded('queue-poll resume');
      if (failed) {
        return -1;
      }
      let sentButUnconsumed = Math.max(0, sentFrames - consumedFrames);
      if (scheduledFallback && started) {
        sentButUnconsumed = Math.max(0, Math.round((nextStartTime
          - Math.max(context.currentTime, segmentStartTime)) * SOURCE_RATE));
        consumedFrames = sentFrames - sentButUnconsumed;
      }
      const frames = preparedFrames + sentButUnconsumed;
      if (started) {
        minimumHeadroomFrames = Math.min(minimumHeadroomFrames, frames);
      }
      return frames;
    }

    function queuedBytes() {
      const frames = queuedFrames();
      return frames < 0 ? -1 : frames * CHANNELS * 2;
    }

    function targetBytes() {
      // A transient stall must not permanently increase interactive latency.
      // Use device time (suspension cannot count as stable playback). Existing
      // PCM drains normally; the producer's backpressure handles the lower
      // target without discarding samples or changing their playback rate.
      if (context !== null && !failed && started
          && context.state === 'running' && targetFrames > MINIMUM_TARGET_FRAMES
          && context.currentTime >= targetRecoveryAt) {
        targetFrames = Math.max(MINIMUM_TARGET_FRAMES,
          targetFrames - TARGET_RAISE_FRAMES);
        ++targetReductions;
        targetRecoveryAt = context.currentTime + TARGET_RECOVERY_SECONDS;
        detail(`stable_playback=1 target_frames=${targetFrames}`);
      }
      return context === null || failed ? -1 : targetFrames * CHANNELS * 2;
    }

    function lowWaterBytes() {
      return context === null || failed ? -1 : lowWaterFrames() * CHANNELS * 2;
    }

    function start() {
      if (context === null || failed) {
        return false;
      }
      if (started) {
        return true;
      }
      if (queuedFrames() < targetFrames) {
        return fail('start', `insufficient prepared frames ${queuedFrames()}`);
      }
      started = true;
      if (scheduledFallback) {
        nextStartTime = context.currentTime + BLOCK_FRAMES / SOURCE_RATE;
        segmentStartTime = nextStartTime;
        if (!flushPrepared()) {
          return false;
        }
      } else if (workletReady) {
        if (!flushPrepared() || workletNode === null) {
          return false;
        }
        workletNode.port.postMessage({ type: 'start' });
      }
      return requestContextResume('start resume');
    }

    function resume(permitGestureRetry = true) {
      // A browser gesture must be allowed to issue a fresh resume request even
      // when a policy-blocked automatic request is still pending.
      return requestContextResume(permitGestureRetry ? 'gesture resume' : 'startup resume', permitGestureRetry);
    }

    function snapshot() {
      return {
        identity: BACKEND_IDENTITY,
        delivery: scheduledFallback ? 'scheduled' : 'worklet',
        failed,
        failureDetail,
        started,
        workletReady,
        contextState: context === null ? 'closed' : context.state,
        contextSeconds: context === null ? 0 : context.currentTime,
        deviceRate: context === null ? 0 : context.sampleRate,
        scheduledAheadMilliseconds: context === null || !scheduledFallback
          ? 0 : Math.max(0, nextStartTime - context.currentTime) * 1000,
        activeSources: sources.size,
        stagingFrames,
        preparedFrames,
        queuedFrames: queuedFrames(),
        reportedWorkletFrames,
        sentFrames,
        consumedFrames,
        blockFrames: BLOCK_FRAMES,
        targetFrames,
        lowWaterFrames: lowWaterFrames(),
        scheduledBuffers,
        scheduledFrames,
        underruns,
        targetRaises,
        targetReductions,
        contextStateChanges,
        resumeAttempts,
        resumeRecoveries,
        largestGapMilliseconds,
        minimumHeadroomFrames: Number.isFinite(minimumHeadroomFrames)
          ? minimumHeadroomFrames : 0,
        baseLatencySeconds: context !== null
          && Number.isFinite(context.baseLatency) ? context.baseLatency : 0,
        outputLatencySeconds: context !== null
          && Number.isFinite(context.outputLatency) ? context.outputLatency : 0,
        detailLines,
      };
    }

    function shutdown() {
      const state = snapshot();
      logger.log.call(logger, `${BACKEND_IDENTITY} summary scheduled_buffers=${state.scheduledBuffers}`
        + ` scheduled_frames=${state.scheduledFrames}`
        + ` consumed_frames=${state.consumedFrames}`
        + ` underruns=${state.underruns}`
        + ` target_frames=${state.targetFrames}`
        + ` target_raises=${state.targetRaises}`
        + ` target_reductions=${state.targetReductions}`
        + ` context_state_changes=${state.contextStateChanges}`
        + ` resume_attempts=${state.resumeAttempts}`
        + ` resume_recoveries=${state.resumeRecoveries}`
        + ` largest_gap_ms=${state.largestGapMilliseconds.toFixed(3)}`
        + ` minimum_headroom_frames=${state.minimumHeadroomFrames}`
        + ` base_latency_ms=${(state.baseLatencySeconds * 1000).toFixed(3)}`
        + ` output_latency_ms=${(state.outputLatencySeconds * 1000).toFixed(3)}`
        + ` failed=${state.failed ? 1 : 0}`);
      closing = true;
      for (const source of sources) {
        try { source.stop(); source.disconnect(); } catch (_) { /* Already ended. */ }
      }
      sources.clear();
      if (workletNode !== null) {
        try {
          workletNode.port.postMessage({ type: 'reset' });
          workletNode.disconnect();
        } catch (_) {
          // A stopped processor has no remaining presentation effect.
        }
      }
      workletNode = null;
      workletReady = false;
      resumePromise = null;
      recoveryNeeded = false;
      prepared = [];
      preparedFrames = 0;
      stagingFrames = 0;
      if (context !== null) {
        try {
          observePromise('close', context.close());
        } catch (reason) {
          fail('close', reason);
        }
      }
      context = null;
    }

    return {
      identity: BACKEND_IDENTITY,
      initialize,
      enqueue,
      queuedBytes,
      targetBytes,
      lowWaterBytes,
      start,
      resume,
      snapshot,
      shutdown,
    };
  }

  if (typeof module === 'object' && module.exports) {
    module.exports = {
      audioWorkletSource: AUDIO_WORKLET_SOURCE,
      createScheduledAudioBackend,
    };
  }
  if (typeof Module !== 'undefined') {
    Module['webAudio'] = createScheduledAudioBackend(root);
  }
}(typeof globalThis === 'object' ? globalThis : this));
</script>
</body>
